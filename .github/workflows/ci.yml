name: ACC CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MLOG_VERSION: v0.38.1
  MLOG_SHA256: 9d1b2f8aa16b81ba146609136697389de06ed3bc447c7c6c19d2f0c66976b7ad

jobs:
  layout:
    name: Layout (ТЗ §4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_layout.sh

  mlog:
    name: mlog check + audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mlog (pinned SHA256)
        run: |
          curl -fsSL -o /usr/local/bin/mlog "https://github.com/ShkodnikAI/Metalogos-/releases/download/${MLOG_VERSION}/mlog-linux-x86_64"
          echo "${MLOG_SHA256}  /usr/local/bin/mlog" | sha256sum -c -
          chmod +x /usr/local/bin/mlog
          mlog --version
      - name: check + audit (все *.mlog, кроме негативных фикстур проб)
        run: |
          set -e
          files=$(git ls-files '*.mlog' | grep -v '^probes/fixtures/')
          [ -n "$files" ] || { echo "нет *.mlog"; exit 1; }
          for f in $files; do
            echo "== $f"
            mlog check "$f"
            mlog audit "$f" | tee audit.log
            if grep -q '\[ERROR\]' audit.log; then echo "audit ERROR в $f"; exit 1; fi
          done
      - name: Passport validation
        run: mlog run tests/passport/run.mlog | tee /dev/stderr | grep -q "FAIL=0"

  store:
    name: "Store: изоляция, живучесть ATTACH, гард схем"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mlog (pinned SHA256)
        run: |
          curl -fsSL -o /usr/local/bin/mlog "https://github.com/ShkodnikAI/Metalogos-/releases/download/${MLOG_VERSION}/mlog-linux-x86_64"
          echo "${MLOG_SHA256}  /usr/local/bin/mlog" | sha256sum -c -
          chmod +x /usr/local/bin/mlog
      - name: Изоляция сайтов и журнала (A.4, A.3; #44 B.2 — алиас site в одном запросе)
        run: |
          mkdir -p data/sites/aa data/sites/bb
          rm -f data/sites/aa/site.db data/sites/bb/site.db
          set -o pipefail
          mlog run tests/store/isolation.mlog 2> isolation.err | tee isolation.out | grep -q "ISOLATION OK=12 FAIL=0"
          # громкая ошибка regex на каждый плохой slug (../a, A, a;DROP);
          # мутация (снять regex в SiteDb) делает этот grep красным
          grep -c "SiteDb: slug" isolation.err | grep -q "^3$"
          # B.2.5 (#44): подмена файла bb копией файла aa → SiteDb("bb")
          # громко падает по личности файла (site.meta, A.1.5);
          # мутация (снять проверку meta в SiteDb) делает шаг красным
          cp data/sites/aa/site.db data/sites/bb/site.db
          mlog run tests/store/isolation_swap.mlog 2> swap.err | tee swap.out | grep -q "SWAP OK=1 FAIL=0"
          grep -q "SiteDb: файл принадлежит другому сайту" swap.err
      - name: Гард прямых имён схем (A.4.3)
        run: ./scripts/check_store_access.sh
      - name: Живучесть ATTACH при serve (A.2) — 50 посл. + 20 парал.
        run: bash tests/store/serve_attach.sh mlog
      - name: Полигон Дежурного (АСС-1.3 A.4) — 5/5
        run: bash tests/polygon/duty/run.sh mlog | tee polygon.out | grep -q "POLYGON duty 5/5"
      - name: Гард exec (АСС-1.4 A.2) — exec только в modules/deadlines/run.mlog
        run: ./scripts/check_exec.sh
      - name: Гард исходящих http (АСС-2.1 A.2) — запросы только через core/http.mlog
        run: ./scripts/check_http.sh
      - name: Тесты allowlist (АСС-2.1 A.3) — 6/6
        run: bash tests/allowlist/run.sh mlog | tee polygon-allowlist.out | grep -q "POLYGON allowlist 6/6"
      - name: Полигон Дедлайнов (АСС-1.4 A.4) — 5/5
        run: bash tests/polygon/deadlines/run.sh mlog | tee polygon-deadlines.out | grep -q "POLYGON deadlines 5/5"
      - name: Полигон Секретаря (АСС-1.5 A.5) — 5/5
        run: bash tests/polygon/secretary/run.sh mlog | tee polygon-secretary.out | grep -q "POLYGON secretary 5/5"
      - name: Полигон «мёртвой руки» (АСС-1.6 A.3) — 3/3
        run: bash tests/polygon/heartbeat/run.sh mlog | tee polygon-heartbeat.out | grep -q "POLYGON heartbeat 3/3"
      - name: Mini App — сессии и каркас (АСС-2.2 A.3) — 7/7
        run: bash tests/miniapp/run.sh mlog | tee miniapp.out | grep -q "MINIAPP OK 7/7"
      - name: Полигон Цен (АСС-3.1 A.4) — 6/6, фикстуры без сети
        run: bash tests/polygon/prices/run.sh mlog | tee polygon-prices.out | grep -q "POLYGON prices 6/6"
      - name: Валидация реестров (АСС-2.4 A.1) — файлы репозитория + негативы
        run: bash tests/registry/check.sh mlog
      - name: Реестры через Mini App (АСС-2.4 A.3) — 5/5, мок GitHub
        run: bash tests/registryapi/run.sh mlog | tee registryapi.out | grep -q "REGISTRYAPI OK 5/5"
      - name: Приём через Mini App (АСС-2.6 A.5) — 6/6, мок GitHub + рестарт крона
        # вывод харнесса в лог всегда, гейт явный (урок молчаливых отказов
        # intake-джобы, 22.10)
        run: |
          set +e
          bash tests/intakeapi/run.sh mlog 2>&1 | tee intakeapi.out
          rc=$?
          echo "=== harness rc=$rc, хвост intakeapi.out: ==="
          tail -30 intakeapi.out
          grep -q "INTAKEAPI OK 6/6" intakeapi.out

  serve:
    name: "Serve: Дежурный под mlog serve (АСС-1.7 A.2)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mlog (pinned SHA256)
        run: |
          curl -fsSL -o /usr/local/bin/mlog "https://github.com/ShkodnikAI/Metalogos-/releases/download/${MLOG_VERSION}/mlog-linux-x86_64"
          echo "${MLOG_SHA256}  /usr/local/bin/mlog" | sha256sum -c -
          chmod +x /usr/local/bin/mlog
      - name: Сценарий 2 под serve — interpreter (блокирующий; Dockerfile AСС-1.7)
        run: bash tests/serve/duty_serve.sh mlog interpreter
      - name: "VM: Metalogos-#1430 (ожидаемо красный — сигнал к возврату на VM, ADR-0003)"
        continue-on-error: true
        run: |
          bash tests/serve/duty_serve.sh mlog vm
          echo "::notice title=VM green::VM: Metalogos-#1430 исправлен? Проверить релиз и вернуть VM (ADR-0003)"

  intake:
    name: "Intake: приём сайта — разведка (АСС-2.5 A.3)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mlog (pinned SHA256)
        run: |
          curl -fsSL -o /usr/local/bin/mlog "https://github.com/ShkodnikAI/Metalogos-/releases/download/${MLOG_VERSION}/mlog-linux-x86_64"
          echo "${MLOG_SHA256}  /usr/local/bin/mlog" | sha256sum -c -
          chmod +x /usr/local/bin/mlog
      - name: "Разведка — 8/8 + deny 2/2 + VM-проба бота"
        # 22.10: джоба в CI умирала за ~2 с без единой строки вывода
        # (три прогона подряд, включая bash -x). Шаг перестроен так, чтобы
        # вывод харнесса ПОПАДАЛ В ЛОГ ВСЕГДА, даже при падении: сначала
        # полный прогон с tee, затем явные diagnostics + гейт.
        run: |
          set +e
          bash -x tests/intake/run.sh mlog 2>&1 | tee intake.out
          rc=$?
          echo "=== harness rc=$rc, хвост intake.out: ==="
          tail -50 intake.out
          grep -q "INTAKE OK" intake.out

  checks:
    name: "Checks: скрипты сроков (юнит с моками сети + smoke)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Юнит-тесты скриптов checks/ (АСС-1.4 A.1, моки сети)
        run: python3 -m unittest discover -s tests/checks -v
      - name: Smoke — cert_expiry.py example.com даёт валидный JSON (АСС-1.4 A.1)
        run: python3 checks/cert_expiry.py example.com | tee cert.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['domain']=='example.com', d; print('smoke cert ok:', d['expires'])"

  probes:
    name: Probes Metalogos (АСС-0, блок B)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mlog (pinned SHA256)
        run: |
          curl -fsSL -o /usr/local/bin/mlog "https://github.com/ShkodnikAI/Metalogos-/releases/download/${MLOG_VERSION}/mlog-linux-x86_64"
          echo "${MLOG_SHA256}  /usr/local/bin/mlog" | sha256sum -c -
          chmod +x /usr/local/bin/mlog
      - name: Run probes (FAIL роняет джобу; ABSENT допустим)
        run: |
          set -o pipefail
          ./probes/run.sh mlog | tee probes-result.md
      - name: Итоги проб в аннотации (читаются через API check-runs)
        if: always()
        run: grep '^| B' probes-result.md | while IFS= read -r l; do echo "::notice title=probe::$l"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes-result
          path: probes-result.md

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (полная история)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner --exit-code 1

  docker:
    name: Docker build + /health
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fosved-acc .
      - name: Сид + bootstrap расписаний + /health (том в /app/data — АСС-1.11 B.1 + D.2)
        run: |
          set -e
          # Модель Render-диска: каталог, записываемый пользователем образа
          # (acc), пустой на первый запуск и ПЕРЕЖИВАЮЩИЙ перезапуск.
          # Именно bind-mount, а не именованный том: пустой именованный том
          # docker сам заполняет содержимым /app/data из образа
          # (copy-on-first-use) и замаскировал бы самый баг, который ловим;
          # диск Render — монтирование хост-каталога, ничего из образа он
          # не получает.
          vol="$(mktemp -d)" && chmod 777 "$vol"
          # Блок D (D.2): в контейнере заданы ACC_INTERNAL_TOKEN и
          # METALOGOS_ENV_ALLOWLIST (в serve env() читается только из
          # allowlist; та же пара нужна на проде — runbook §2; heartbeat-URL
          # пуст → skip, без пинга из CI). Тестовый токен — литерал
          # (прецедент: tests/serve/duty_serve.sh).
          # Прогон 1: пустой диск — сид раскладывает конфигурацию, стартовый
          # скрипт (start.sh) регистрирует расписания через bootstrap-маршруты.
          docker run -d --name acc -p 10000:10000 \
            -e ACC_INTERNAL_TOKEN=poly-internal-token \
            -e METALOGOS_ENV_ALLOWLIST=ACC_INTERNAL_TOKEN,ACC_HEARTBEAT_URL \
            -v "$vol:/app/data" fosved-acc
          for i in $(seq 1 60); do
            body=$(curl -s localhost:10000/health) && [ -n "$body" ] && break
            sleep 1
          done
          # Строка bootstrap появляется ПОСЛЕ /health (start.sh зовёт
          # маршруты, когда serve уже поднялся; duty при сбое сайта ждёт
          # 60 с подтверждения) — ждём её до ~180 с.
          for i in $(seq 1 90); do
            docker logs acc 2>&1 | grep -q '^bootstrap: duty=200 deadlines=200 secretary=200$' && break
            sleep 2
          done
          docker logs acc > acc-run1.log 2>&1
          tail -20 acc-run1.log
          # Проверка 1: строка сида в логе старта.
          grep -q '^seed: sites=1 registry=3 static=3$' acc-run1.log
          # Проверка D.2.1: все три расписания зарегистрированы на старте.
          grep -q '^bootstrap: duty=200 deadlines=200 secretary=200$' acc-run1.log
          # Проверка 2: паспорт сайта оказался на диске.
          docker exec acc test -f /app/data/sites/tega/passport.json
          # Проверка 4: /health → ok.
          echo "health: $body"
          echo "::notice title=health::$body"
          echo "$body" | grep -q '"status":"ok"'
          # Маркер состояния — создаём ДО перезапуска; должен пережить прогон 2
          # (сид перезаписывает только конфигурацию, состояние не трогает).
          docker exec acc sh -c 'echo state > /app/data/sites/tega/state.marker'
          docker rm -f acc
          # Прогон 2 на том же диске: конфигурация снова засеяна, состояние
          # живо, расписания НЕ задублированы (D.2.2).
          docker run -d --name acc2 -p 10000:10000 \
            -e ACC_INTERNAL_TOKEN=poly-internal-token \
            -e METALOGOS_ENV_ALLOWLIST=ACC_INTERNAL_TOKEN,ACC_HEARTBEAT_URL \
            -v "$vol:/app/data" fosved-acc
          for i in $(seq 1 60); do
            body2=$(curl -s localhost:10000/health) && [ -n "$body2" ] && break
            sleep 1
          done
          for i in $(seq 1 90); do
            docker logs acc2 2>&1 | grep -q '^bootstrap: duty=200 deadlines=200 secretary=200$' && break
            sleep 2
          done
          docker logs acc2 > acc-run2.log 2>&1
          tail -20 acc-run2.log
          grep -q '^seed: sites=1 registry=3 static=3$' acc-run2.log
          grep -q '^bootstrap: duty=200 deadlines=200 secretary=200$' acc-run2.log
          # Проверка 3: маркер состояния пережил перезапуск.
          docker exec acc2 test -f /app/data/sites/tega/state.marker
          # Проверка D.2.2: повторный старт не создал дублей duty-tick —
          # отчёт маршрута показывает action=exists (cron_list нашёл джобу,
          # созданную на прогоне 1; проверка «по report из ответа», как в
          # tests/serve/duty_serve.sh — sanctioned D.2).
          rep2="$(docker exec acc2 curl -s --max-time 180 "http://127.0.0.1:10000/internal/duty/bootstrap?token=poly-internal-token")"
          echo "duty report (2-й старт): $rep2"
          echo "$rep2" | grep -q 'action=exists'
          echo "health2: $body2"
          echo "$body2" | grep -q '"status":"ok"'
          docker rm -f acc2

  deploy:
    name: Deploy to Render (hook, ref=SHA)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [layout, mlog, store, serve, intake, checks, probes, secrets, docker]
    steps:
      - name: Деплой по хуку Render (параметр ref=SHA, документация Render — C.1)
        env:
          ACC_RENDER_DEPLOY_HOOK: ${{ secrets.ACC_RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${ACC_RENDER_DEPLOY_HOOK}" ]; then
            echo "deploy: секрет ACC_RENDER_DEPLOY_HOOK не задан — падаю (деплой только по хуку; урок FOSVED-office-v2 #524). Заведите секрет — docs/runbook/deploy.md, шаг 3."
            exit 1
          fi
          # URL хука в лог не выводится: ответ только кодом (-o /dev/null)
          code="$(curl -s -X POST "${ACC_RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}" -o /dev/null -w "%{http_code}")"
          if [ -z "${code}" ] || [ "${code}" = "000" ]; then
            echo "deploy: хук недоступен (сеть) — падаю"
            exit 1
          fi
          echo "deploy: хук ответил ${code}"
          case "${code}" in
            2*) echo "deploy: принят"; ;;
            *) echo "deploy: хук ответил ${code} — падаю"; exit 1; ;;
          esac

  research:
    name: Research АСС-0 (C.2) + АСС-1.4 A.5 (информационный, не блокирует мерж)
    runs-on: ubuntu-24.04
    # Информационная джоба: внешние сайты могут быть недоступны с раннера.
    # Результат читается в логе, на мерж не влияет (не проверка качества кода).
    continue-on-error: true
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: A.5 (АСС-1.4) — срок сертификата и домена tega.plus / pravo.by (checks/, без персональных данных)
        run: |
          python3 checks/cert_expiry.py tega.plus | tee -a a5.txt
          python3 checks/domain_expiry.py tega.plus | tee -a a5.txt
          python3 checks/cert_expiry.py pravo.by | tee -a a5.txt
          python3 checks/domain_expiry.py pravo.by | tee -a a5.txt
          grep -E '^\{' a5.txt | while IFS= read -r l; do echo "::notice title=A.5::$l"; done
      - name: C.2 — ленты pravo.by и tnpa.by
        run: ./scripts/research/legal_feeds.sh | tee c2.txt; grep -v '^    ' c2.txt | head -10 | while IFS= read -r l; do echo "::notice title=C.2::$l"; done
